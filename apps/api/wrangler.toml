name = "karta-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "DB"
class_name = "KartaDB"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KartaDB"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "karta-files"

[vars]
WEB_URL = "http://localhost:5173"
# Karta's cut of each sale, in basis points (1000 = 10%)
PLATFORM_FEE_BPS = "1000"

# Secrets (wrangler secret put): STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RENDER_URL, RENDER_SECRET
